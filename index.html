<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lager-Manager iPad</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #e67e22;
            --dark: #34495e;
            --bg: #f4f7f6;
        }

        body { 
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding: 30px 15px;
            margin: 0;
        }

        .container { 
            width: 100%; 
            max-width: 850px; /* Optimiert für iPad Breite */
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        
        h2 { border-bottom: 2px solid #eee; padding-bottom: 12px; margin-top: 35px; font-size: 1.6em; color: var(--dark); }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }

        /* Eingabefelder iPad-optimiert */
        input { 
            width: 100%; 
            padding: 15px; 
            margin-top: 10px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 18px; /* Größer für iPad Tastatur */
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary); }
        
        /* Buttons iPad-optimiert */
        button { 
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: transform 0.1s, background 0.2s; 
            font-size: 16px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active { transform: scale(0.97); }

        .btn-add { background-color: var(--success); color: white; width: 100%; padding: 18px; margin-top: 15px; font-size: 18px; }
        .btn-finish { background-color: var(--primary); color: white; width: 100%; padding: 20px; margin-top: 30px; font-size: 20px; }
        .btn-admin { background-color: var(--dark); color: white; width: 100%; padding: 15px; margin-top: 50px; opacity: 0.8; }
        .btn-clear { background-color: var(--danger); color: white; padding: 15px; margin-top: 25px; width: 100%; }
        
        /* Produktliste Gitter-Layout für Tablets */
        #productList {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Zwei Spalten auf dem iPad */
            gap: 15px;
            margin-top: 15px;
        }

        .product-item { 
            background: #fff; 
            border: 2px solid #f0f0f0; 
            padding: 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 12px; 
        }
        .product-item:active { background-color: #f9fdfb; border-color: var(--success); }

        .stock-badge { background: #f0f0f0; padding: 6px 12px; border-radius: 6px; font-size: 0.9em; font-weight: bold; }

        /* Warenkorb */
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #eee; 
            font-size: 18px;
        }
        .cart-controls { display: flex; gap: 10px; }
        .btn-qty { width: 45px; height: 45px; font-size: 20px; }
        .btn-minus { background-color: var(--warning); color: white; }
        .btn-plus { background-color: var(--success); color: white; }
        .btn-del { background-color: var(--danger); color: white; }

        /* Summe & Historie */
        .total-section { margin-top: 20px; padding: 25px; background: #f8f9fa; border-radius: 12px; font-size: 1.6em; font-weight: bold; text-align: right; }
        .history-item { background: #f9f9f9; border-left: 6px solid var(--primary); padding: 15px; margin-bottom: 12px; border-radius: 4px; }
        
        .hidden { display: none; }
        .close-history-x { background: #bdc3c7; color: white; padding: 8px 15px; width: auto; font-size: 14px; }

        /* Responsive für hochkantes iPad / Handy */
        @media (max-width: 600px) {
            #productList { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Neues Produkt erstellen</h2>
    <input type="text" id="pName" placeholder="Produktname">
    <input type="number" id="pPrice" placeholder="Preis (€)" step="0.01">
    <input type="number" id="pStock" placeholder="Anzahl auf Lager">
    <button class="btn-add" onclick="addProduct()">Produkt hinzufügen</button>

    <hr>
    <h2>Verfügbare Produkte</h2>
    <div id="productList"></div>

    <hr>
    <h2>Warenkorb</h2>
    <div id="cartList"></div>
    <div class="total-section">Gesamt: <span id="totalPrice">0.00</span> €</div>
    <button class="btn-finish" onclick="finishInvoice()">Rechnung abschließen</button>

    <button class="btn-admin" onclick="toggleHistory()">Verlauf anzeigen </button>
    
    <div id="historySection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
            <h2>Rechnungs-Historie</h2>
            <button class="close-history-x" onclick="closeHistory()">X Schließen</button>
        </div>
        <div id="historyList"></div>
        <button class="btn-clear" onclick="clearAllData()">KOMPLETT-RESET</button>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('myInventory')) || [];
    let invoices = JSON.parse(localStorage.getItem('myInvoices')) || [];
    let cart = [];
    const PASSWORT = "1234";

    window.onload = () => renderProducts();

    function saveData() {
        localStorage.setItem('myInventory', JSON.stringify(products));
        localStorage.setItem('myInvoices', JSON.stringify(invoices));
    }

    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = parseFloat(document.getElementById('pPrice').value);
        const stock = parseInt(document.getElementById('pStock').value);
        if (name && !isNaN(price) && !isNaN(stock)) {
            products.push({ id: Date.now(), name, price, stock });
            saveData(); renderProducts();
            document.querySelectorAll('input').forEach(i => i.value = '');
        }
    }

    function renderProducts() {
        const list = document.getElementById('productList');
        list.innerHTML = '';
        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.onclick = () => addToCart(p.id);
            div.innerHTML = `<span><strong>${p.name}</strong><br><small>${p.price.toFixed(2)} €</small></span>
                             <span class="stock-badge">Lager: ${p.stock}</span>`;
            list.appendChild(div);
        });
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        if (product && product.stock > 0) {
            product.stock--;
            const item = cart.find(c => c.id === productId);
            if (item) item.quantity++; else cart.push({ ...product, quantity: 1, stock: undefined });
            saveData(); renderProducts(); renderCart();
        }
    }

    function removeFromCart(productId) {
        const item = cart.find(c => c.id === productId);
        const product = products.find(p => p.id === productId);
        if (item) {
            item.quantity--; product.stock++;
            if (item.quantity <= 0) cart = cart.filter(c => c.id !== productId);
            saveData(); renderProducts(); renderCart();
        }
    }

    function deleteFromCart(productId) {
        const idx = cart.findIndex(c => c.id === productId);
        const product = products.find(p => p.id === productId);
        if (idx > -1) {
            product.stock += cart[idx].quantity;
            cart.splice(idx, 1);
            saveData(); renderProducts(); renderCart();
        }
    }

    function renderCart() {
        const list = document.getElementById('cartList');
        let total = 0;
        list.innerHTML = cart.length === 0 ? "<small>Warenkorb leer</small>" : "";
        cart.forEach(item => {
            const sub = item.price * item.quantity; total += sub;
            list.innerHTML += `<div class="cart-item">
                <span>${item.name} (x${item.quantity})<br><small>${sub.toFixed(2)} €</small></span>
                <div class="cart-controls">
                    <button class="btn-qty btn-minus" onclick="removeFromCart(${item.id})">-</button>
                    <button class="btn-qty btn-plus" onclick="addToCart(${item.id})">+</button>
                    <button class="btn-qty btn-del" onclick="deleteFromCart(${item.id})">x</button>
                </div></div>`;
        });
        document.getElementById('totalPrice').innerText = total.toFixed(2);
    }

    function finishInvoice() {
        if (cart.length === 0) return;
        invoices.push({ date: new Date().toLocaleString(), items: [...cart], total: document.getElementById('totalPrice').innerText });
        saveData(); alert("Rechnung gespeichert!");
        cart = []; renderCart(); renderProducts();
        if(!document.getElementById('historySection').classList.contains('hidden')) renderHistory();
    }

    function toggleHistory() {
        const section = document.getElementById('historySection');
        if (!section.classList.contains('hidden')) {
            closeHistory();
        } else {
            const pw = prompt("Admin-Passwort:");
            if (pw === PASSWORT) {
                section.classList.remove('hidden');
                renderHistory();
            } else if (pw !== null) alert("Falsch!");
        }
    }

    function closeHistory() {
        document.getElementById('historySection').classList.add('hidden');
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = invoices.length === 0 ? "Keine Rechnungen." : "";
        invoices.slice().reverse().forEach(inv => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<strong>${inv.date}</strong> — <b>${inv.total} €</b><br>
                             <small>${inv.items.map(i => i.name + " (x"+i.quantity+")").join(", ")}</small>`;
            list.appendChild(div);
        });
    }

    function clearAllData() {
        if(confirm("Wirklich ALLES löschen?")) { localStorage.clear(); location.reload(); }
    }
</script>
</body>
</html>
