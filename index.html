<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt Rechner (mit Speicher)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            cursor: pointer;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover { background-color: #27ae60; }
        .product-list, .cart-list { list-style: none; padding: 0; }
        .product-item {
            background: #fff;
            border: 1px solid #eee;
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
        }
        .product-item:hover { background-color: #f9f9f9; border-color: #2ecc71; }
        .total-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 3px solid #333;
            font-size: 1.2em;
            font-weight: bold;
            text-align: right;
        }
        .stock-info { font-size: 0.8em; color: #666; }
        .clear-btn { background-color: #e74c3c; margin-top: 10px; }
        .clear-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Neues Produkt erstellen</h2>
    <div class="form-group">
        <input type="text" id="pName" placeholder="Produktname">
        <input type="number" id="pPrice" placeholder="Preis (€)" step="0.01">
        <input type="number" id="pStock" placeholder="Anzahl auf Lager">
        <button onclick="addProduct()" style="margin-top: 10px; width: 100%;">Produkt hinzufügen</button>
    </div>

    <hr>

    <h2>Verfügbare Produkte</h2>
    <div id="productList" class="product-list"></div>
    <button class="clear-btn" onclick="clearStorage()" style="width: 100%;">Alle Produkte löschen</button>

    <hr>

    <h2>Gewählte Produkte</h2>
    <div id="cartList" class="cart-list"></div>

    <div class="total-section">
        Gesamtsumme: <span id="totalPrice">0.00</span> €
    </div>
    <button onclick="finishInvoice()" style="margin-top: 20px; width: 100%; background-color: #3498db;">
        Rechnung abschließen & Lager speichern
    </button>
</div>

<script>
    let products = [];
    let cart = [];

    // BEIM LADEN: Daten aus LocalStorage holen
    window.onload = function() {
        const savedProducts = localStorage.getItem('myInventory');
        if (savedProducts) {
            products = JSON.parse(savedProducts);
            renderProducts();
        }
    };

    // SPEICHERN: Aktuellen Stand in LocalStorage schreiben
    function saveData() {
        localStorage.setItem('myInventory', JSON.stringify(products));
    }

    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = parseFloat(document.getElementById('pPrice').value);
        const stock = parseInt(document.getElementById('pStock').value);

        if (name && !isNaN(price) && !isNaN(stock)) {
            const product = { id: Date.now(), name, price, stock };
            products.push(product);
            
            saveData(); // Speichern
            renderProducts();
            
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '';
        } else {
            alert("Bitte alle Felder korrekt ausfüllen.");
        }
    }

    function renderProducts() {
        const list = document.getElementById('productList');
        list.innerHTML = '';
        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.onclick = () => addToCart(p.id);
            div.innerHTML = `
                <span><strong>${p.name}</strong> - ${p.price.toFixed(2)} €</span>
                <span class="stock-info">Lager: ${p.stock} Stk.</span>
            `;
            list.appendChild(div);
        });
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);

        if (product && product.stock > 0) {
            product.stock--; 
            
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1, stock: undefined }); 
            }
            
            saveData(); // Lagerstand nach Klick speichern
            renderProducts();
            renderCart();
        } else {
            alert("Nicht mehr auf Lager!");
        }
    }

    function renderCart() {
        const list = document.getElementById('cartList');
        const totalDisplay = document.getElementById('totalPrice');
        list.innerHTML = '';
        let total = 0;

        cart.forEach(item => {
            const subtotal = item.price * item.quantity;
            total += subtotal;
            const div = document.createElement('div');
            div.style.padding = "5px 0";
            div.innerHTML = `• ${item.name}: ${item.quantity}x (${subtotal.toFixed(2)} €)`;
            list.appendChild(div);
        });
        totalDisplay.innerText = total.toFixed(2);
    }
    
    function finishInvoice() {
        if (cart.length === 0) {
            alert("Der Warenkorb ist leer.");
            return;
        }
        alert(`Rechnung abgeschlossen! Der Lagerbestand wurde dauerhaft gespeichert.`);
        cart = [];
        renderCart();
        saveData(); // Finaler Stand speichern
    }

    // Hilfsfunktion zum kompletten Reset
    function clearStorage() {
        if(confirm("Alle Produkte wirklich löschen?")) {
            localStorage.removeItem('myInventory');
            products = [];
            renderProducts();
        }
    }
</script>

</body>
</html>
